[package]
name = "c2pa_view"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
mime_guess = "2.0.5"
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

# Preserve native OpenSSL/default HTTP features; OpenSSL is unsupported on Wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
c2pa = { git = "https://github.com/in-reality/c2pa-rs", rev = "b250db0849cdd2667f7edfa94d4de374dea3e806", features = ["file_io", "rust_native_crypto"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
c2pa = { git = "https://github.com/in-reality/c2pa-rs", rev = "b250db0849cdd2667f7edfa94d4de374dea3e806", default-features = false, features = ["file_io", "rust_native_crypto", "default_http"] }

[dev-dependencies]
pollster = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
