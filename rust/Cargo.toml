[package]
name = "c2pa_view"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
c2pa = { git = "https://github.com/in-reality/c2pa-rs", rev = "a882e87ade9f89559b9973bb6b0799c3a8bdb3ec", features = ["file_io", "rust_native_crypto"] }
flutter_rust_bridge = "=2.13.0"
mime_guess = "2.0.5"
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
pollster = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
