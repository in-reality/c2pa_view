[package]
name = "c2pa_view"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
c2pa = { git = "https://github.com/in-reality/c2pa-rs", rev = "67c0a31c718876f54238be81b484ca3cfc0d273d", features = ["file_io", "rust_native_crypto"] }
flutter_rust_bridge = "=2.13.0"
mime_guess = "2.0.5"
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
pollster = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
